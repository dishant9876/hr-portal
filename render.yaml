databases:
  - name: talentbridge-db
    plan: free
    databaseName: talentbridge
    user: talentbridge

services:
  - type: web
    name: talentbridge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentbridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://talentbridge-hr-portal.netlify.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://talentbridge-hr-portal.netlify.app
      - key: PYTHON_VERSION
        value: 3.11.11
